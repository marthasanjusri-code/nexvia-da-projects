version: 2

models:
  - name: stg_ml__customer_clv
    description: Predicted CLV per customer, from the Python model.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_crm__customers')
                field: customer_id
      - name: probability_alive
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: clv_12m_usd
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
