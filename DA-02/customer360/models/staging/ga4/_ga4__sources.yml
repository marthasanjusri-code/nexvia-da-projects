version: 2

sources:
  - name: ga4
    description: >
      Google Analytics 4 event export for the Google Merchandise Store
      (public, obfuscated sample). One row per event, 2020-11-01 to 2021-01-31.
      Read in place from bigquery-public-data; one daily table per day (events_YYYYMMDD).
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: "events_*"
        description: All daily event tables, read through a wildcard.
