name: 'customer360'
version: '1.0.0'
config-version: 2

profile: 'customer360'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Analysis date: the day after the last day of GA4 data (2021-01-31).
  # The data is historical, so a fixed date is used instead of current_date.
  as_of_date: '2021-02-01'
  # Attribution settings, from Google's defaults:
  # 90-day lookback for key events other than first_visit/first_open,
  # 7-day half-life for time decay.
  attribution_lookback_days: 90
  time_decay_half_life_days: 7

models:
  customer360:
    # Staging: one view per source, renamed and typed, no business logic.
    staging:
      +materialized: view
      +schema: staging
    # Intermediate: joins and logic shared by several marts.
    intermediate:
      +materialized: table
      +schema: intermediate
    # Marts: final tables for analysis and Tableau.
    marts:
      +materialized: table
      +schema: marts

seeds:
  customer360:
    # Static reference lists only (raw data is loaded as sources).
    +schema: seeds
